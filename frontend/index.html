<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// -----------------------------------------------------
// Config
// -----------------------------------------------------
// URL del websocket: si esto se sirve desde el mismo relay (Render o local
// via http://localhost:8081), usamos el mismo host/puerto automaticamente.
// Si se abre el archivo directo (file://) o se sirve desde otro origen
// (ej. GitHub Pages), cae a localhost:8081 para desarrollo.
const WS_URL = (() => {
  if (location.protocol === "http:" || location.protocol === "https:") {
    const esquema = location.protocol === "https:" ? "wss:" : "ws:";
    return `${esquema}//${location.host}`;
  }
  return "ws://localhost:8081";
})();

let MAX_FILAS_HISTORIAL = 200;   // se puede ajustar via config del server
let INTERVALO_S = 0.25;          // debe matchear intervaloMs del server (en segundos)
const ESPACIO_ENTRE_FILAS = 0.5;

// -----------------------------------------------------
// Rango de tiempo del historial (switch "corto/medio/largo"). El historial
// de paredes vive SOLO en el navegador (se arma con los ticks que van
// llegando, el server no guarda nada) -- para mostrar mas tiempo sin que
// la cantidad de filas (y por lo tanto de draw calls de InstancedMesh)
// se dispare, en vez de agregar una fila por CADA tick del server, en los
// modos largos salteamos ticks y agregamos una fila cada N -- la cantidad
// de filas en pantalla se mantiene mas o menos constante (MAX_FILAS_
// HISTORIAL), lo que cambia es cuanto tiempo real representa cada una.
// -----------------------------------------------------
const PRESETS_TIEMPO = [
  { id: "corto", segundosObjetivo: null }, // null = sin saltear, maxima resolucion (el comportamiento de antes)
  { id: "medio", segundosObjetivo: 120 },
  { id: "largo", segundosObjetivo: 300 },
  { id: "muylargo", segundosObjetivo: 900 }, // 15m
];
let presetTiempoIdx = 0;
let ticksPorFila = 1;
let contadorTicksHistorial = 0;

function ticksPorFilaPara(preset) {
  if (preset.segundosObjetivo == null) return 1;
  return Math.max(1, Math.round(preset.segundosObjetivo / (MAX_FILAS_HISTORIAL * INTERVALO_S)));
}

function recalcularTicksPorFila() {
  ticksPorFila = ticksPorFilaPara(PRESETS_TIEMPO[presetTiempoIdx]);
}

function duracionTotalSeg() {
  return Math.round(MAX_FILAS_HISTORIAL * INTERVALO_S * ticksPorFila);
}

function formatearDuracion(seg) {
  // minutos SOLO en marcas redondas (120, 180, 240...) -- para el resto
  // mostrar decimales de minuto ("1.6m") se lee peor que directo en
  // segundos.
  if (seg < 120 || seg % 60 !== 0) return `${seg}s`;
  return `${seg / 60}m`;
}
const ANCHO_TOTAL_DESEADO = 52; // mas ancho de escena -> paredes menos finitas con mas buckets
const ALTURA_MAX_PARED = 6;
const ALTURA_MIN_PARED = 0.12;

// El DOM (fila en vivo) se dibuja mas alto que una pared normal para que se
// note que es "la fila del frente" -- antes 1.35x, ahora mas amplificado.
const MULT_ALTURA_DOM = 1.7;
// Techo teorico: la altura mas alta que puede llegar a tener CUALQUIER
// barra del DOM (volumen maximo posible). Las etiquetas numericas y las
// burbujas de trades usan este valor FIJO en vez de la altura de su propio
// nivel de precio -- antes, si una barra vecina era mas alta, tapaba
// visualmente (por la perspectiva de la camara) a la etiqueta/burbuja de al
// lado aunque tecnicamente no estuviera "detras" de nada. Con una altura
// fija por encima de TODO lo que pueda existir, siempre quedan arriba.
const ALTURA_TOPE_DOM = ALTURA_MAX_PARED * MULT_ALTURA_DOM - 3;
const ALTURA_ETIQUETAS_DOM = ALTURA_TOPE_DOM + 0.9;
// margen fijo que se le suma a la altura LOCAL de la pared de un trade para
// posicionar su burbuja -- ver agregarTrade().
const MARGEN_BURBUJA = 0.55;

// Escala de color tipo Bookmap: NO relativa al maximo de cada tick (eso hace
// que la escala "respire" y sea imposible comparar una pared con la de hace
// 20s). Usamos una escala LOGARITMICA con un techo que se adapta lento
// (percentil aproximado, actualizado con inercia), asi los colores son
// comparables entre ticks y entre filas del historial.
let techoColorBid = 1;
let techoColorAsk = 1;
const INERCIA_TECHO = 0.02; // que tan rapido se adapta el techo (mas bajo = mas estable)

function actualizarTechos(niveles) {
  let maxBid = 1e-6, maxAsk = 1e-6;
  for (const n of niveles) {
    if (n.bid > maxBid) maxBid = n.bid;
    if (n.ask > maxAsk) maxAsk = n.ask;
  }
  // el techo sube rapido si aparece un pico grande, pero baja lento
  // (asi una pared gigante que ya se fue no se olvida de golpe)
  techoColorBid = maxBid > techoColorBid ? maxBid : techoColorBid * (1 - INERCIA_TECHO) + maxBid * INERCIA_TECHO;
  techoColorAsk = maxAsk > techoColorAsk ? maxAsk : techoColorAsk * (1 - INERCIA_TECHO) + maxAsk * INERCIA_TECHO;
}

// -----------------------------------------------------
// Modos de paleta de color (switch en pantalla).
//  - bookmap: UNA sola rampa (no distingue bid/ask por color, solo por
//    posicion arriba/abajo del precio) que va de casi-negro a azul a
//    celeste a blanco y recien en los extremos reales a amarillo/rojo,
//    como el BookMap real. Es el modo por defecto.
//  - clasico: verde/rojo saturados con las paredes MAS grandes resaltadas
//    en amarillo-naranja.
//  - violeta: comprador blanco/gris, vendedor violeta/lila con matiz fijo.
//  - grises: blanco y negro puro -- comprador claro, vendedor oscuro.
// -----------------------------------------------------

// Paradas de la rampa "bookmap": [t, color]. Rango de luminosidad MUCHO
// mas ancho que el modo clasico (que se movia solo entre 0.2 y 0.72 de
// luminosidad con saturacion siempre >= 0.85 -- por eso todo el piso
// cercano al precio se veia como un bloque solido de un unico verde/rojo
// y se perdian los escalones). Con multiples tramos de matiz + un rango
// de brillo casi completo (de casi-negro a casi-blanco) cada escalon
// intermedio cae en una banda de color distinta y se puede leer a simple
// vista, y el amarillo/naranja/rojo queda reservado para paredes
// realmente extremas.
const PARADAS_BOOKMAP = [
  [0.00, 0x070b12],
  [0.14, 0x0d2038],
  [0.30, 0x14406b],
  [0.46, 0x2a76a8],
  [0.62, 0x5fc2d9],
  [0.78, 0xd9f2f5],
  [0.90, 0xffe27a],
  [0.97, 0xff9d2e],
  [1.00, 0xff3b3b],
];
const _stopA = new THREE.Color();
const _stopB = new THREE.Color();
function colorRampaBookmap(t, destino) {
  let i = 0;
  while (i < PARADAS_BOOKMAP.length - 2 && t > PARADAS_BOOKMAP[i + 1][0]) i++;
  const [t0, c0] = PARADAS_BOOKMAP[i];
  const [t1, c1] = PARADAS_BOOKMAP[i + 1];
  const local = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
  _stopA.set(c0);
  _stopB.set(c1);
  destino.copy(_stopA).lerp(_stopB, Math.min(1, Math.max(0, local)));
  return destino;
}

const MODOS_COLOR = [
  { id: "bookmap", label: "BookMap" },
  { id: "clasico", label: "Clásico" },
  { id: "violeta", label: "Violeta" },
  { id: "grises", label: "B/N" },
];
let modoColorIdx = 0;

function colorPorVolumen(qty, techo, esBid) {
  const t = techo > 0 ? Math.min(Math.log1p(qty) / Math.log1p(techo), 1) : 0;
  const color = new THREE.Color();
  const modo = MODOS_COLOR[modoColorIdx].id;

  if (modo === "bookmap") {
    colorRampaBookmap(t, color);
  } else if (modo === "grises") {
    // Blanco y negro: comprador tira a blanco/gris claro, vendedor a gris
    // oscuro/casi negro -- se distinguen por CLARO vs OSCURO, sin usar
    // ningun tinte de color.
    const luminosidad = esBid ? Math.min(0.97, 0.3 + t * 0.67) : Math.min(0.55, 0.06 + t * 0.48);
    color.setHSL(0, 0, luminosidad);
  } else if (modo === "violeta") {
    if (esBid) {
      // Comprador: blancos y grises, sin tinte de color.
      const luminosidad = Math.min(0.97, 0.16 + t * 0.81);
      color.setHSL(0, 0, luminosidad);
    } else {
      // Vendedor: violeta/lila con el MATIZ FIJO -- nunca migra a blanco,
      // asi el lado se distingue siempre sea cual sea el volumen.
      const saturacion = Math.min(0.92, 0.55 + t * 0.37);
      const luminosidad = Math.min(0.82, 0.24 + t * 0.5);
      color.setHSL(0.8, saturacion, luminosidad);
    }
  } else {
    // Clasico: verde (bid) / rojo (ask) bien saturados. Las paredes MAS
    // grandes (t > 0.85) se resaltan en amarillo-naranja intenso en vez de
    // seguir la escala normal -- asi se lee de un vistazo cuales son los
    // niveles de liquidez mas importantes, igual que en Bookmap real.
    if (t > 0.85) {
      const tAmarillo = (t - 0.85) / 0.15;
      color.setHSL(0.14 - tAmarillo * 0.05, 0.95, 0.5 + tAmarillo * 0.15);
    } else {
      const hue = esBid ? 0.33 : 0.98;
      const saturacion = Math.min(1, 0.85 + t * 0.15);
      const luminosidad = Math.min(0.72, 0.2 + t * 0.5);
      color.setHSL(hue, saturacion, luminosidad);
    }
  }
  return color;
}

let ESCALA_X = null;
let ultimoNiveles = null;

// -----------------------------------------------------
// Escena
// -----------------------------------------------------
const escena = new THREE.Scene();
escena.background = new THREE.Color(0x05070a);
// el fog arrancaba a los 25 y ya estaba todo negro a los 110 -- con el
// historial llegando a ~100 unidades de profundidad, la mayor parte del
// mapa se apagaba de mas. Lo empujamos mas lejos para que las paredes del
// fondo se sigan viendo con color, y solo el horizonte lejano se difumina.
escena.fog = new THREE.Fog(0x05070a, 55, 200);

const camara = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camara.position.set(0, 32, 46); // un poco mas atras/arriba para encuadrar la escena mas ancha

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = "absolute";
labelRenderer.domElement.style.top = "0px";
labelRenderer.domElement.style.pointerEvents = "none";
document.body.appendChild(labelRenderer.domElement);

const controles = new OrbitControls(camara, renderer.domElement);
controles.target.set(0, 0, -20);
controles.enableDamping = true;
controles.dampingFactor = 0.12;
controles.minDistance = 8;
controles.maxDistance = 160; // escena mas ancha (52) -> hace falta poder alejarse mas para verla entera
controles.maxPolarAngle = Math.PI * 0.49;
// Pan explicito: el precio ahora oscila LIBRE dentro de la ventana fija
// (ya no se re-centra solo en cada tick), asi que para ver liquidez en un
// precio que quedo lejos del centro (ej. USD 63.000 con el precio en vivo
// en USD 65.000) hace falta poder mover la camara con el pan, no solo con
// el zoom. enablePan ya viene en true por default en OrbitControls, pero
// lo dejamos explicito y le subimos la velocidad porque la escena ahora es
// mas ancha (52 unidades) y con la velocidad default se sentia lento.
controles.enablePan = true;
controles.panSpeed = 1.3;
controles.screenSpacePanning = true;
// El pellizco (pinch) en celu anda bien porque usa un camino de eventos
// touch distinto -- lo dejamos intacto (enableZoom sigue en true, que es
// lo que tambien habilita el pinch). El problema es solo la RUEDA del
// mouse: bajar zoomSpeed no alcanzo porque algunos mouses/trackpads con
// scroll de alta resolucion mandan decenas de eventos "wheel" por cada
// click fisico de la rueda, y esos eventos se siguen multiplicando entre
// si aunque cada uno pese poco. La solucion que realmente lo arregla:
// interceptar el evento wheel ANTES de que le llegue a OrbitControls y
// hacer nuestro propio zoom con un paso fijo por evento Y un limite de
// "un paso cada tantos milisegundos" -- asi no importa cuantos eventos
// mande el mouse por notch, el resultado visual es siempre un paso chico
// y prolijo. OJO: OrbitControls registra su propio listener de wheel
// directamente sobre renderer.domElement, asi que agregar OTRO listener
// (aunque sea con capture:true) en el MISMO elemento no garantiza orden
// -- en el target, el orden es el de registro, no el de capture/bubble.
// Por eso interceptamos un nivel mas arriba, en window, en fase de
// captura: ahi SI la captura corre antes de llegar al canvas, sin
// ambiguedad, y con stopPropagation el evento nunca llega a OrbitControls.
controles.enableZoom = true;

// Zoom manual (dolly): acerca/aleja la camara a lo largo de la linea
// camara-target, respetando min/maxDistance. La usan tanto el handler de
// rueda de mas abajo como los botones +/- en pantalla.
function aplicarZoom(factor) {
  const offset = new THREE.Vector3().subVectors(camara.position, controles.target);
  const distancia = THREE.MathUtils.clamp(offset.length() * factor, controles.minDistance, controles.maxDistance);
  offset.setLength(distancia);
  camara.position.copy(controles.target).add(offset);
}

// Interceptamos la rueda en WINDOW, en fase de captura -- eso corre antes
// de que el evento baje hasta el canvas, así que con stopPropagation()
// OrbitControls nunca llega a ver el evento (su zoom nativo, el que se
// sentia descontrolado, no se ejecuta). El touch/pinch no pasa por
// 'wheel', asi que esto no afecta nada en el celu.
const PASO_ZOOM_RUEDA = 1.06;
const THROTTLE_RUEDA_MS = 55; // un solo paso por cada "rafaga" de eventos wheel
let ultimaRuedaTs = 0;

window.addEventListener(
  "wheel",
  (ev) => {
    if (!renderer.domElement.contains(ev.target) && ev.target !== renderer.domElement) return;
    ev.preventDefault();
    ev.stopPropagation();
    const ahora = performance.now();
    if (ahora - ultimaRuedaTs < THROTTLE_RUEDA_MS) return;
    ultimaRuedaTs = ahora;
    aplicarZoom(ev.deltaY > 0 ? PASO_ZOOM_RUEDA : 1 / PASO_ZOOM_RUEDA);
  },
  { capture: true, passive: false }
);

// Botones +/- en pantalla: alternativa al mouse/touch para acercar o
// alejar. Un click hace un paso; mantenerlo apretado repite el paso cada
// pocos ms (funciona igual con mouse y con touch en celu).
function conectarBotonZoom(idBoton, factorPorPaso) {
  const boton = document.getElementById(idBoton);
  let intervalo = null;
  const disparar = () => aplicarZoom(factorPorPaso);
  const empezar = (ev) => {
    ev.preventDefault();
    disparar();
    intervalo = setInterval(disparar, 90);
  };
  const parar = () => { if (intervalo) { clearInterval(intervalo); intervalo = null; } };
  boton.addEventListener("mousedown", empezar);
  boton.addEventListener("touchstart", empezar, { passive: false });
  ["mouseup", "mouseleave", "touchend", "touchcancel"].forEach((evt) => boton.addEventListener(evt, parar));
}
conectarBotonZoom("zoom-mas", 1 / 1.12);
conectarBotonZoom("zoom-menos", 1.12);

escena.add(new THREE.AmbientLight(0xffffff, 0.6));
const luzDir = new THREE.DirectionalLight(0xffffff, 0.4);
luzDir.position.set(5, 20, 10);
escena.add(luzDir);

const grid = new THREE.GridHelper(140, 40, 0x1a2b3c, 0x1a2b3c);
grid.position.set(0, -3, -40);
escena.add(grid);

function crearEtiqueta(texto, clase) {
  const div = document.createElement("div");
  div.className = "etiqueta " + (clase || "");
  div.textContent = texto;
  return new CSS2DObject(div);
}

const grupoEjeTiempo = new THREE.Group();
escena.add(grupoEjeTiempo);
function reconstruirEjeTiempo() {
  grupoEjeTiempo.clear();
  // el intervalo EFECTIVO por fila es INTERVALO_S * ticksPorFila -- en los
  // modos "medio"/"largo" cada fila representa varios ticks del server.
  const intervaloEfectivoS = INTERVALO_S * ticksPorFila;
  const totalSeg = duracionTotalSeg();
  const pasos = 5;
  for (let i = 1; i <= pasos; i++) {
    const seg = Math.round((totalSeg / pasos) * i);
    const z = -(seg / intervaloEfectivoS) * ESPACIO_ENTRE_FILAS;
    const et = crearEtiqueta(`-${formatearDuracion(seg)}`, "tiempo");
    et.position.set(-ANCHO_TOTAL_DESEADO / 2 - 2, -2.7, z);
    grupoEjeTiempo.add(et);
  }
  const etAhora = crearEtiqueta("ahora", "tiempo");
  etAhora.position.set(-ANCHO_TOTAL_DESEADO / 2 - 2, -2.7, 0);
  grupoEjeTiempo.add(etAhora);
}
reconstruirEjeTiempo();

// -----------------------------------------------------
// Filas de historial, con InstancedMesh (una sola geometria/material por
// fila, tantas instancias como buckets). Antes se creaba un Mesh + Material
// por bucket por tick -- con 121 buckets * 200 filas de historial eso son
// decenas de miles de objetos y materiales vivos, muy pesado para el GC y
// el renderer. InstancedMesh dibuja todo en una sola draw call por fila.
// -----------------------------------------------------
const filas = []; // cada item: { instanced, niveles }
const grupoFilas = new THREE.Group();
escena.add(grupoFilas);

const geomBase = new THREE.BoxGeometry(1, 1, ESPACIO_ENTRE_FILAS * 0.85);
const matBase = new THREE.MeshStandardMaterial({ roughness: 0.6, transparent: true, opacity: 0.9 });

const _matrizTmp = new THREE.Matrix4();
const _colorTmp = new THREE.Color();

// Marcas de trades ejecutados, persistentes sobre el historial. Antes las
// unicas burbujas de trades se desvanecian y desaparecian a los pocos
// segundos (ver actualizarBurbujas) -- se pidio que ademas dejen una marca
// que perdure junto con la pared del historial en la que ocurrieron, tanto
// del lado bid como ask. Geometria/material COMPARTIDOS entre todas las
// marcas (mismo motivo que geomBase/matBase: nada de crear uno nuevo por
// trade).
const geomMarca = new THREE.BoxGeometry(1, 1, 1);
const matMarca = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.95 });
const COLOR_MARCA_COMPRA = 0xfff176; // amarillo brillante -- agresor comprador
const COLOR_MARCA_VENTA = 0xff8a3d;  // naranja brillante -- agresor vendedor

function crearFila(niveles) {
  const cantidad = niveles.length;
  // OJO: NO clonar el material -- el color de cada bucket sale del
  // atributo instanceColor (por-instancia), no de material.color, asi
  // que las 200 filas del historial pueden compartir el MISMO material
  // sin problema. Clonarlo (como se hacia antes) creaba un Material
  // nuevo en CADA tick para siempre, generando basura constante para el
  // garbage collector -- con el rango de precio ampliado (mas buckets
  // por fila) eso alcanzaba a trabar el render en sesiones largas.
  const instanced = new THREE.InstancedMesh(geomBase, matBase, cantidad);
  instanced.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cantidad * 3), 3);

  niveles.forEach((nivel, i) => {
    const qty = nivel.bid + nivel.ask;
    const techo = nivel.bid >= nivel.ask ? techoColorBid : techoColorAsk;
    const proporcion = techo > 0 ? Math.min(Math.log1p(qty) / Math.log1p(techo), 1) : 0;
    const altura = ALTURA_MIN_PARED + proporcion * (ALTURA_MAX_PARED - ALTURA_MIN_PARED);

    _matrizTmp.makeScale(ESCALA_X * 0.95, altura, 1);
    _matrizTmp.setPosition(
      (i - (niveles.length - 1) / 2) * ESCALA_X,
      altura / 2 - 3,
      0
    );
    instanced.setMatrixAt(i, _matrizTmp);

    const esBid = nivel.bid >= nivel.ask;
    _colorTmp.copy(colorPorVolumen(qty, esBid ? techoColorBid : techoColorAsk, esBid));
    instanced.setColorAt(i, _colorTmp);
  });
  instanced.instanceMatrix.needsUpdate = true;
  if (instanced.instanceColor) instanced.instanceColor.needsUpdate = true;

  return instanced;
}

// Agrega, como HIJOS del InstancedMesh de la fila, pequenas marcas
// brillantes sobre cada bucket donde hubo al menos un trade en este tick
// (o en la tanda de ticks salteados, si el switch de tiempo esta en modo
// medio/largo). Al ser hijos del mesh de la fila, viajan automaticamente
// hacia atras con ella (mismo position.z -= ESPACIO_ENTRE_FILAS de siempre)
// sin necesidad de logica extra -- y se liberan solos cuando la fila se
// recicla, si se los dispone explicitamente (ver el trim mas abajo).
function agregarMarcasDeTrades(filaInstanced, niveles, trades) {
  if (!trades || !trades.length || !ESCALA_X || niveles.length < 2) return;
  const bucketSize = Math.abs(niveles[1].precio - niveles[0].precio);
  if (!bucketSize) return;
  const bucketDe = (precio) => Math.floor(precio / bucketSize) * bucketSize;

  const indicePorPrecio = new Map();
  niveles.forEach((n, i) => indicePorPrecio.set(n.precio, i));

  const acumPorIndice = new Map(); // idx -> { compra, venta }
  for (const trade of trades) {
    const idx = indicePorPrecio.get(bucketDe(trade.precio));
    if (idx === undefined) continue;
    const entry = acumPorIndice.get(idx) || { compra: 0, venta: 0 };
    if (trade.esVentaAgresiva) entry.venta += trade.qty; else entry.compra += trade.qty;
    acumPorIndice.set(idx, entry);
  }
  if (acumPorIndice.size === 0) return;

  const indices = Array.from(acumPorIndice.keys());
  const marcas = new THREE.InstancedMesh(geomMarca, matMarca, indices.length);
  marcas.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(indices.length * 3), 3);

  indices.forEach((idx, k) => {
    const nivel = niveles[idx];
    const alturaPared = alturaEscenaDeNivel(nivel); // 0..ALTURA_MAX_PARED
    const { compra, venta } = acumPorIndice.get(idx);

    _matrizTmp.makeScale(ESCALA_X * 0.98, 0.14, ESPACIO_ENTRE_FILAS * 0.9);
    _matrizTmp.setPosition(
      (idx - (niveles.length - 1) / 2) * ESCALA_X,
      (alturaPared - 3) + 0.14, // justo sobre la superficie de ESA pared puntual
      0
    );
    marcas.setMatrixAt(k, _matrizTmp);
    _colorTmp.set(compra >= venta ? COLOR_MARCA_COMPRA : COLOR_MARCA_VENTA);
    marcas.setColorAt(k, _colorTmp);
  });
  marcas.instanceMatrix.needsUpdate = true;
  if (marcas.instanceColor) marcas.instanceColor.needsUpdate = true;
  filaInstanced.add(marcas);
}

function agregarTickAlHistorial(niveles, trades) {
  if (ESCALA_X === null) {
    ESCALA_X = ANCHO_TOTAL_DESEADO / niveles.length;
  }

  actualizarTechos(niveles);
  ultimoNiveles = niveles;

  const instanced = crearFila(niveles);
  instanced.position.z = 0;
  instanced.userData = { niveles };
  grupoFilas.add(instanced);
  filas.push(instanced);

  agregarMarcasDeTrades(instanced, niveles, trades);

  for (const f of filas) f.position.z -= ESPACIO_ENTRE_FILAS;

  if (filas.length > MAX_FILAS_HISTORIAL) {
    const vieja = filas.shift();
    grupoFilas.remove(vieja);
    // geometry y material son COMPARTIDOS (geomBase / matBase, y geomMarca
    // / matMarca para las marcas de trades hijas) entre las 200 filas -- si
    // se hiciera dispose() de esos objetos compartidos aca se romperian las
    // otras 199 filas que siguen vivas usandolos. Lo unico propio de cada
    // fila (y de sus marcas hijas) es su buffer de instancias (matrices +
    // colores), que si hay que liberar.
    for (const hijo of vieja.children) hijo.dispose?.();
    vieja.dispose?.(); // libera los buffers de instancia (matrix/color) de ESTA fila
  }
}

// -----------------------------------------------------
// DOM (Depth Of Market) en vivo. A diferencia de las paredes de historial
// -- que quedan fijas en el instante en que se crearon y se van alejando
// hacia atras -- este bloque SIEMPRE muestra el ultimo estado del book, y
// esta parado justo ADELANTE de "ahora" (z positivo, mas cerca de camara).
// Es "el espacio antes de entrar a la linea de tiempo real": cada tick
// nuevo aparece primero aca, con los numeros exactos de bid/ask como una
// escalera clasica de trading, y recien el tick siguiente ese dato pasa a
// ser una pared mas del historial que fluye hacia atras.
// -----------------------------------------------------
// Z_DOM mas grande que antes (1.8 -> 3.6): mas distancia entre el DOM y el
// resto del grafico para que se lea como un bloque separado, no pegado al
// historial.
const Z_DOM = 3.6;
const CANT_ETIQUETAS_DOM = 7; // se muestran espaciadas parejo, igual tecnica que las etiquetas de precio

let domInstanced = null;
const grupoDOM = new THREE.Group();
escena.add(grupoDOM);
const matDOM = new THREE.MeshStandardMaterial({
  roughness: 0.25, metalness: 0.15, transparent: true, opacity: 1,
  emissive: 0x223344, emissiveIntensity: 0.35, // leve brillo propio para que se lea como "en vivo", no historial
});

// Placa base mas ancha que las paredes (antes +1.5, ahora +5) para que el
// DOM se vea como un bloque mas grande/amplificado, no del mismo tamaño que
// una fila de historial cualquiera.
const baseDOM = new THREE.Mesh(
  new THREE.BoxGeometry(ANCHO_TOTAL_DESEADO + 5, 0.06, ESPACIO_ENTRE_FILAS * 1.4),
  new THREE.MeshStandardMaterial({
    color: 0xffe27a, emissive: 0xffe27a, emissiveIntensity: 0.5, transparent: true, opacity: 0.55,
  })
);
baseDOM.position.set(0, -3.03, Z_DOM);
escena.add(baseDOM);

// divisor luminoso en z=0 ("ahora"): marca la frontera entre el DOM en vivo
// (adelante) y el historial que ya quedo fijo en el tiempo (atras).
const divisorAhora = new THREE.Mesh(
  new THREE.BoxGeometry(ANCHO_TOTAL_DESEADO + 1.5, 0.03, 0.04),
  new THREE.MeshBasicMaterial({ color: 0x6fa8ff, transparent: true, opacity: 0.45 })
);
divisorAhora.position.set(0, -3, 0);
escena.add(divisorAhora);

const etiquetasDOM = [];
const grupoEtiquetasDOM = new THREE.Group();
escena.add(grupoEtiquetasDOM);
for (let i = 0; i < CANT_ETIQUETAS_DOM; i++) {
  const et = crearEtiqueta("", "dom");
  grupoEtiquetasDOM.add(et);
  etiquetasDOM.push(et);
}

function actualizarDOM(niveles) {
  if (domInstanced) {
    grupoDOM.remove(domInstanced);
    // mismo motivo que en crearFila: geometria y material son compartidos
    // (geomBase / matDOM), asi que NO se disponen aca -- solo se liberan
    // los buffers de instancia propios de este mesh puntual.
    domInstanced.dispose?.();
  }

  const cantidad = niveles.length;
  // matDOM sin clonar: el color sale de instanceColor, no hace falta un
  // material distinto en cada tick (antes se creaba y se tiraba uno nuevo
  // cada 150ms para siempre, generando basura constante).
  const instanced = new THREE.InstancedMesh(geomBase, matDOM, cantidad);
  instanced.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cantidad * 3), 3);
  const alturas = new Array(cantidad); // se reusa para posicionar las etiquetas exactamente sobre cada barra

  niveles.forEach((nivel, i) => {
    const qty = nivel.bid + nivel.ask;
    const esBid = nivel.bid >= nivel.ask;
    const techo = esBid ? techoColorBid : techoColorAsk;
    const proporcion = techo > 0 ? Math.min(Math.log1p(qty) / Math.log1p(techo), 1) : 0;
    // notoriamente mas alta que las paredes de historial, para que se
    // distinga a simple vista que esta es "la fila del frente", en vivo
    const altura = (ALTURA_MIN_PARED + proporcion * (ALTURA_MAX_PARED - ALTURA_MIN_PARED)) * MULT_ALTURA_DOM;
    alturas[i] = altura;

    _matrizTmp.makeScale(ESCALA_X * 0.95, altura, 1.15);
    _matrizTmp.setPosition(
      (i - (niveles.length - 1) / 2) * ESCALA_X,
      altura / 2 - 3,
      0
    );
    instanced.setMatrixAt(i, _matrizTmp);
    _colorTmp.copy(colorPorVolumen(qty, techo, esBid));
    instanced.setColorAt(i, _colorTmp);
  });
  instanced.instanceMatrix.needsUpdate = true;
  if (instanced.instanceColor) instanced.instanceColor.needsUpdate = true;
  instanced.position.z = Z_DOM;
  instanced.userData = { niveles };
  grupoDOM.add(instanced);
  domInstanced = instanced;

  // etiquetas numericas: MISMO espaciado parejo que actualizarEtiquetasPrecio
  // (probado que no se pisan) -- asi cada etiqueta de precio de abajo tiene
  // arriba, en el DOM, su numero exacto de bid/ask correspondiente.
  const paso = Math.max(1, Math.floor(niveles.length / (CANT_ETIQUETAS_DOM - 1)));
  for (let j = 0; j < CANT_ETIQUETAS_DOM; j++) {
    const idx = Math.min(niveles.length - 1, j * paso);
    const et = etiquetasDOM[j];
    const nivel = niveles[idx];
    if (!nivel) { et.element.textContent = ""; continue; }
    const esBid = nivel.bid >= nivel.ask;
    const valor = esBid ? nivel.bid : nivel.ask;
    et.element.textContent = valor > 0 ? valor.toFixed(2) : "";
    et.element.className = "etiqueta dom " + (esBid ? "bid" : "ask");
    // Altura FIJA (ALTURA_ETIQUETAS_DOM), no relativa a la barra propia --
    // asi la etiqueta siempre queda por encima de CUALQUIER barra vecina,
    // sin importar cual sea mas alta. Antes, pegada a su propia barra, una
    // pared vecina mas alta la tapaba visualmente.
    et.position.set(
      (idx - (niveles.length - 1) / 2) * ESCALA_X,
      ALTURA_ETIQUETAS_DOM,
      Z_DOM + 0.7
    );
  }
}

// -----------------------------------------------------
// Marcador de precio en vivo. Ahora que la ventana de precios es FIJA (se
// re-centra sola solo al acercarse al margen, ver server.js), el precio
// "oscila" adentro de esa ventana en vez de quedar siempre pegado al medio.
// Sin algo que marque exactamente donde esta el precio ahora mismo, esa
// oscilacion no se nota a simple vista (sobre todo si el book esta calmo y
// no hay trades nuevos moviendo burbujas). Esta barra vertical brillante
// se mueve en X segun el precio en vivo y cruza desde el DOM hasta arriba
// de las paredes, bien visible.
// -----------------------------------------------------
// Altura del poste: desde la base (-3, mismo piso que el DOM) hasta bien
// arriba del DOM -- tiene que ser el elemento mas alto de toda la escena
// para que se note claramente el movimiento en X del precio en vivo dentro
// de la ventana fija, sin que nada lo tape. Ya NO depende de la altura de
// las burbujas (que ahora quedan bajas, "apenas sobre el grafico") -- el
// marcador se mide contra el DOM, que es el elemento mas alto real.
const ALTURA_TOPE_MARCADOR = ALTURA_TOPE_DOM + 1.5;
const ALTO_MARCADOR = ALTURA_TOPE_MARCADOR + 3; // base del poste en y=-3, mismo piso que el DOM
const geomMarcador = new THREE.BoxGeometry(0.22, ALTO_MARCADOR, 0.22);
const matMarcador = new THREE.MeshBasicMaterial({
  color: 0xfff45c, transparent: true, opacity: 0.9,
});
const marcadorPrecio = new THREE.Mesh(geomMarcador, matMarcador);
marcadorPrecio.position.set(0, (-3 + ALTURA_TOPE_MARCADOR) / 2, Z_DOM);
escena.add(marcadorPrecio);

const etiquetaMarcador = crearEtiqueta("--", "dom");
etiquetaMarcador.element.style.background = "rgba(255, 244, 92, 0.9)";
etiquetaMarcador.element.style.color = "#1a1400";
etiquetaMarcador.element.style.fontWeight = "bold";
etiquetaMarcador.element.style.fontSize = "16px";
escena.add(etiquetaMarcador);

function actualizarMarcadorPrecio(precio, centro, bucketSize) {
  if (!ESCALA_X || precio == null || centro == null || !bucketSize) return;
  const offsetX = ((precio - centro) / bucketSize) * ESCALA_X;
  marcadorPrecio.position.x = offsetX;
  etiquetaMarcador.position.set(offsetX, ALTURA_TOPE_MARCADOR + 0.6, Z_DOM);
  etiquetaMarcador.element.textContent = precio.toLocaleString("en-US", { maximumFractionDigits: 1 });
}

function alturaEscenaDeNivel(nivel) {
  if (!nivel) return 0;
  const qty = nivel.bid + nivel.ask;
  const esBid = nivel.bid >= nivel.ask;
  const techo = esBid ? techoColorBid : techoColorAsk;
  const proporcion = techo > 0 ? Math.min(Math.log1p(qty) / Math.log1p(techo), 1) : 0;
  return ALTURA_MIN_PARED + proporcion * (ALTURA_MAX_PARED - ALTURA_MIN_PARED);
}

// -----------------------------------------------------
// Etiquetas de precio
// -----------------------------------------------------
const CANT_ETIQUETAS_PRECIO = 7;
const etiquetasPrecio = [];
const grupoEtiquetasPrecio = new THREE.Group();
escena.add(grupoEtiquetasPrecio);
for (let i = 0; i < CANT_ETIQUETAS_PRECIO; i++) {
  const et = crearEtiqueta("--", "precio");
  grupoEtiquetasPrecio.add(et);
  etiquetasPrecio.push(et);
}

function actualizarEtiquetasPrecio(niveles) {
  const paso = Math.max(1, Math.floor(niveles.length / (CANT_ETIQUETAS_PRECIO - 1)));
  for (let i = 0; i < CANT_ETIQUETAS_PRECIO; i++) {
    const idx = Math.min(niveles.length - 1, i * paso);
    const nivel = niveles[idx];
    const et = etiquetasPrecio[i];
    et.element.textContent = nivel.precio.toLocaleString("en-US");
    et.position.set(
      (idx - (niveles.length - 1) / 2) * ESCALA_X,
      0.5,
      0.5
    );
  }
}

// -----------------------------------------------------
// Burbujas de trades
// -----------------------------------------------------
const burbujas = [];
const grupoBurbujas = new THREE.Group();
escena.add(grupoBurbujas);
let lineaTrades = null;

function agregarTrade(trade, precioReferencia, bucketSize) {
  const radio = Math.min(1.6, 0.22 + Math.sqrt(trade.qty) * 0.65);
  const geom = new THREE.SphereGeometry(radio, 18, 18);
  const color = trade.esVentaAgresiva ? 0xff5c7a : 0xbfe6ff;
  const mat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.55, transparent: true, opacity: 0.95,
  });
  const mesh = new THREE.Mesh(geom, mat);

  const offsetX = ESCALA_X ? ((trade.precio - precioReferencia) / bucketSize) * ESCALA_X : 0;

  // Altura RELATIVA a la pared de SU PROPIO nivel de precio (no una altura
  // fija de escena) -- se pidio que las burbujas queden "apenas sobre el
  // grafico", pegadas a su contorno, en vez de flotando en un plano
  // desconectado mas arriba. Puede pasar que una pared vecina MUY alta
  // tape visualmente una burbuja de un nivel bajo al lado (limitacion de
  // la perspectiva de camara) -- si eso vuelve a ser un problema, avisen y
  // volvemos a una altura fija, pero mas moderada que antes.
  let alturaBase = 0;
  if (ultimoNiveles) {
    let mejor = null;
    let mejorDist = Infinity;
    for (const nivel of ultimoNiveles) {
      const dist = Math.abs(nivel.precio - trade.precio);
      if (dist < mejorDist) { mejorDist = dist; mejor = nivel; }
    }
    if (mejor) alturaBase = alturaEscenaDeNivel(mejor) - 3;
  }
  mesh.position.set(offsetX, alturaBase + MARGEN_BURBUJA + radio, 0.4);

  grupoBurbujas.add(mesh);
  burbujas.push({ mesh, vida: 0 });
}

function actualizarBurbujas(dt) {
  // usa el intervalo EFECTIVO (con el saltado de ticksPorFila aplicado) para
  // que la velocidad de las burbujas siga siendo la misma con la que las
  // paredes se corren hacia atras, sea cual sea el modo de tiempo elegido.
  const velocidadZ = ESPACIO_ENTRE_FILAS / (INTERVALO_S * ticksPorFila);
  for (let i = burbujas.length - 1; i >= 0; i--) {
    const b = burbujas[i];
    b.vida += dt;
    b.mesh.position.z -= dt * velocidadZ;
    b.mesh.material.opacity = Math.max(0, 0.95 - b.vida / 14);
    if (b.mesh.position.z < -ESPACIO_ENTRE_FILAS * MAX_FILAS_HISTORIAL) {
      grupoBurbujas.remove(b.mesh);
      b.mesh.geometry.dispose();
      b.mesh.material.dispose();
      burbujas.splice(i, 1);
    }
  }

  if (lineaTrades) {
    escena.remove(lineaTrades);
    lineaTrades.geometry.dispose();
    lineaTrades.material.dispose();
    lineaTrades = null;
  }
  if (burbujas.length > 1) {
    const puntos = burbujas.slice(-50).map((b) => b.mesh.position.clone());
    const geom = new THREE.BufferGeometry().setFromPoints(puntos);
    const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
    lineaTrades = new THREE.Line(geom, mat);
    escena.add(lineaTrades);
  }
}

// -----------------------------------------------------
// Switch de rango de tiempo (corto/medio/largo). Cambiar de modo vacia el
// historial que ya estaba armado -- las filas viejas fueron construidas
// con el ticksPorFila ANTERIOR, asi que mezclarlas con las nuevas haria
// que cada una representara una porcion de tiempo distinta. Es mas prolijo
// arrancar de cero y dejar que se vuelva a llenar con el modo nuevo.
// -----------------------------------------------------
function limpiarHistorial() {
  for (const f of filas) {
    grupoFilas.remove(f);
    for (const hijo of f.children) hijo.dispose?.(); // marcas de trades hijas de esta fila
    f.dispose?.();
  }
  filas.length = 0;
  for (const b of burbujas) {
    grupoBurbujas.remove(b.mesh);
    b.mesh.geometry.dispose();
    b.mesh.material.dispose();
  }
  burbujas.length = 0;
  if (lineaTrades) {
    escena.remove(lineaTrades);
    lineaTrades.geometry.dispose();
    lineaTrades.material.dispose();
    lineaTrades = null;
  }
}

const contenedorBotonesTiempo = document.getElementById("controles-tiempo");
PRESETS_TIEMPO.forEach((preset, idx) => {
  const boton = document.createElement("button");
  boton.type = "button";
  boton.dataset.idx = String(idx);
  contenedorBotonesTiempo.appendChild(boton);
});

function actualizarBotonesTiempo() {
  const botones = contenedorBotonesTiempo.querySelectorAll("button");
  botones.forEach((boton, idx) => {
    const preset = PRESETS_TIEMPO[idx];
    // el label muestra la duracion REAL que va a quedar en pantalla para
    // ESE preset, no un numero fijo -- si el server usa otro INTERVALO_
    // ENVIO_MS, el boton siempre dice la verdad en vez de prometer un
    // "2m"/"5m" que despues no es exacto.
    const seg = Math.round(MAX_FILAS_HISTORIAL * INTERVALO_S * ticksPorFilaPara(preset));
    boton.textContent = formatearDuracion(seg);
    boton.classList.toggle("activo", idx === presetTiempoIdx);
  });
}
actualizarBotonesTiempo();

function seleccionarPresetTiempo(idx) {
  if (idx === presetTiempoIdx) return;
  presetTiempoIdx = idx;
  recalcularTicksPorFila();
  contadorTicksHistorial = 0;
  tradesAcumulados = [];
  limpiarHistorial();
  reconstruirEjeTiempo();
  actualizarBotonesTiempo();
}
contenedorBotonesTiempo.addEventListener("click", (ev) => {
  const boton = ev.target.closest("button");
  if (!boton) return;
  seleccionarPresetTiempo(Number(boton.dataset.idx));
});

// -----------------------------------------------------
// Switch de paleta de color (clasico/violeta/B-N). A diferencia del switch
// de tiempo, ACA no hace falta vaciar el historial -- solo hay que
// repintar el instanceColor de cada fila ya existente (paredes + DOM) con
// la formula del modo nuevo. La geometria/posicion no cambia para nada.
// -----------------------------------------------------
function recolorearTodo() {
  for (const f of filas) {
    const niveles = f.userData && f.userData.niveles;
    if (!niveles) continue;
    niveles.forEach((nivel, i) => {
      const qty = nivel.bid + nivel.ask;
      const esBid = nivel.bid >= nivel.ask;
      const techo = esBid ? techoColorBid : techoColorAsk;
      _colorTmp.copy(colorPorVolumen(qty, techo, esBid));
      f.setColorAt(i, _colorTmp);
    });
    if (f.instanceColor) f.instanceColor.needsUpdate = true;
  }
  if (domInstanced && domInstanced.userData && domInstanced.userData.niveles) {
    const niveles = domInstanced.userData.niveles;
    niveles.forEach((nivel, i) => {
      const qty = nivel.bid + nivel.ask;
      const esBid = nivel.bid >= nivel.ask;
      const techo = esBid ? techoColorBid : techoColorAsk;
      _colorTmp.copy(colorPorVolumen(qty, techo, esBid));
      domInstanced.setColorAt(i, _colorTmp);
    });
    if (domInstanced.instanceColor) domInstanced.instanceColor.needsUpdate = true;
  }
}

const contenedorBotonesColor = document.getElementById("controles-color");
MODOS_COLOR.forEach((modo, idx) => {
  const boton = document.createElement("button");
  boton.type = "button";
  boton.textContent = modo.label;
  boton.dataset.idx = String(idx);
  boton.classList.toggle("activo", idx === modoColorIdx);
  contenedorBotonesColor.appendChild(boton);
});
contenedorBotonesColor.addEventListener("click", (ev) => {
  const boton = ev.target.closest("button");
  if (!boton) return;
  const idx = Number(boton.dataset.idx);
  if (idx === modoColorIdx) return;
  modoColorIdx = idx;
  contenedorBotonesColor.querySelectorAll("button").forEach((b, i) => {
    b.classList.toggle("activo", i === modoColorIdx);
  });
  recolorearTodo();
});

// -----------------------------------------------------
// Conexion al relay
// -----------------------------------------------------
const elEstado = document.getElementById("estado");
const elPrecio = document.getElementById("precio");
const elSimbolo = document.getElementById("simbolo");
const elDelta = document.getElementById("delta");
const elGexValor = document.getElementById("gex-valor");
const elGexRegimen = document.getElementById("gex-regimen");
let precioActual = null;
let acumDelta = 0;
let ultimoResetDelta = performance.now();
// Ultimo centro de ventana conocido -- para detectar cuando el server
// re-centra el ancla (ver correccion mas abajo, en ws.onmessage).
let ultimoCentroConocido = null;
// trades acumulados desde la ULTIMA fila creada -- en modo tiempo medio/
// largo se saltean varios ticks del server por cada fila (ver
// ticksPorFila), asi que los trades de los ticks salteados no se pierden:
// se van juntando aca y se le pasan todos juntos a la fila que SI se crea.
let tradesAcumulados = [];

// Referencia al socket activo -- la necesitan los botones de pan (fuera de
// conectar()) para poder mandarle mensajes al server sin duplicar la
// conexion.
let wsActivo = null;

function enviarAlServer(msg) {
  if (wsActivo && wsActivo.readyState === WebSocket.OPEN) {
    wsActivo.send(JSON.stringify(msg));
  }
}

document.getElementById("pan-arriba").addEventListener("click", () => {
  enviarAlServer({ tipo: "pan", direccion: 1 });
});
document.getElementById("pan-abajo").addEventListener("click", () => {
  enviarAlServer({ tipo: "pan", direccion: -1 });
});
// El badge de estado, cuando esta en modo manual, funciona como boton para
// volver a seguir el precio en vivo (ver mas abajo donde se le pone la
// clase "manual").
elEstado.addEventListener("click", () => {
  if (elEstado.classList.contains("manual")) enviarAlServer({ tipo: "seguir" });
});

function conectar() {
  const ws = new WebSocket(WS_URL);
  wsActivo = ws;

  ws.onopen = () => {
    elEstado.textContent = "en vivo";
    elEstado.className = "ok";
  };
  ws.onclose = () => {
    elEstado.textContent = "reconectando...";
    elEstado.className = "caido";
    setTimeout(conectar, 2000);
  };
  ws.onerror = () => ws.close();

  ws.onmessage = (ev) => {
    const data = JSON.parse(ev.data);

    if (data.tipo === "config") {
      if (data.symbol) elSimbolo.textContent = data.symbol;
      if (data.intervaloMs) INTERVALO_S = data.intervaloMs / 1000;
      recalcularTicksPorFila();
      actualizarBotonesTiempo();
      reconstruirEjeTiempo();
      return;
    }
    if (data.tipo !== "tick") return;

    if (data.binance === "demo") {
      elEstado.textContent = "demo (sin Binance)";
      elEstado.className = "demo";
    } else if (elEstado.className !== "ok" && elEstado.className !== "manual") {
      elEstado.textContent = "en vivo";
      elEstado.className = "ok";
    }
    // Modo manual: el usuario paneo con las flechas y el auto-recentrado
    // del server esta pausado (ver server.js) -- se refleja en el badge,
    // que ademas funciona como boton para volver a "en vivo" (ver el click
    // listener mas arriba, junto a wsActivo).
    if (data.modoManual && data.binance !== "demo") {
      elEstado.textContent = "manual (click para seguir en vivo)";
      elEstado.className = "manual";
    } else if (!data.modoManual && elEstado.className === "manual") {
      elEstado.textContent = "en vivo";
      elEstado.className = "ok";
    }

    precioActual = data.mid;
    elPrecio.textContent = precioActual.toFixed(1);

    const bucketSize = data.niveles.length > 1
      ? Math.abs(data.niveles[1].precio - data.niveles[0].precio)
      : 5;
    // Las paredes (niveles) ahora estan armadas alrededor de data.centro, el
    // ancla de la ventana FIJA -- NO alrededor del precio en vivo (que
    // oscila libre adentro de esa ventana, ver orderbook.js).
    const centroVentana = data.centro ?? precioActual;

    // CORRECCION DE RE-CENTRADO (fix del escalon falso en el historial):
    // cada fila de historial se dibuja con sus paredes centradas en el
    // ancla que tenia el server EN ESE MOMENTO (centroVentana). Cuando el
    // precio en vivo se acerca al borde de la ventana, el server salta el
    // ancla a un nuevo centro (ver MARGEN_RECENTRADO_USD en server.js) --
    // pero las filas YA DIBUJADAS se quedaban con su posicion vieja, asi
    // que el salto se veia como un escalon en X que no correspondia a
    // ningun movimiento real de precio (incluso podia ir para el lado
    // contrario al que se movio el precio real). Ahora, apenas detectamos
    // que el ancla cambio, corremos TODAS las filas y burbujas ya
    // existentes por el delta exacto -- quedan alineadas a un mismo eje de
    // precio absoluto y el re-centrado pasa a ser invisible: no hay salto,
    // solo se corrio la ventana visible.
    if (ultimoCentroConocido !== null && ESCALA_X && centroVentana !== ultimoCentroConocido) {
      const deltaX = ((centroVentana - ultimoCentroConocido) / bucketSize) * ESCALA_X;
      for (const f of filas) f.position.x -= deltaX;
      for (const b of burbujas) b.mesh.position.x -= deltaX;
    }
    ultimoCentroConocido = centroVentana;

    // el DOM, las etiquetas de precio y el marcador reflejan el book EN
    // VIVO, se actualizan siempre. Las paredes de historial son las que se
    // saltean segun el modo de tiempo elegido (ver PRESETS_TIEMPO).
    contadorTicksHistorial++;
    if (data.trades && data.trades.length) tradesAcumulados.push(...data.trades);
    if (contadorTicksHistorial % ticksPorFila === 0) {
      agregarTickAlHistorial(data.niveles, tradesAcumulados);
      tradesAcumulados = [];
    }
    actualizarEtiquetasPrecio(data.niveles);
    actualizarDOM(data.niveles);

    if (data.gex) {
      const millones = data.gex.netGEX / 1e6;
      const signo = millones >= 0 ? "+" : "";
      elGexValor.textContent = `${signo}${millones.toFixed(1)}M USD`;
      elGexRegimen.textContent = data.gex.regimen === "largo" ? "· gamma largo" : "· gamma corto";
      elGexRegimen.className = data.gex.regimen === "largo" ? "largo" : "corto";
      elGexValor.className = "valor " + (data.gex.regimen === "largo" ? "largo" : "corto");
    }

    acumDelta += data.deltaAgresor || 0;
    const ahora = performance.now();
    if (ahora - ultimoResetDelta > 10000) {
      acumDelta = data.deltaAgresor || 0;
      ultimoResetDelta = ahora;
    }
    elDelta.textContent = (acumDelta >= 0 ? "+" : "") + Math.round(acumDelta).toLocaleString("en-US") + " USD";
    elDelta.className = acumDelta >= 0 ? "compra" : "venta";

    // bucketSize/centroVentana ya se calcularon arriba (antes de la
    // correccion de re-centrado) -- las burbujas usan la MISMA referencia
    // que las paredes o van a quedar mal ubicadas en X.
    for (const trade of data.trades) {
      agregarTrade(trade, centroVentana, bucketSize);
    }
    actualizarMarcadorPrecio(precioActual, centroVentana, bucketSize);
  };
}
conectar();

// -----------------------------------------------------
// Reloj de Argentina
// -----------------------------------------------------
const elHoraAR = document.getElementById("hora-ar");
function actualizarRelojAR() {
  elHoraAR.textContent = new Date().toLocaleTimeString("es-AR", {
    timeZone: "America/Argentina/Buenos_Aires",
    hour12: false,
  });
}
actualizarRelojAR();
setInterval(actualizarRelojAR, 1000);

// -----------------------------------------------------
// Tooltip (compatible con InstancedMesh via instanceId)
// -----------------------------------------------------
const tooltip = document.getElementById("tooltip");
const tooltipPrecio = document.getElementById("tooltip-precio");
const tooltipQty = document.getElementById("tooltip-qty");
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
let mousePantalla = { x: 0, y: 0 };
let hoverActivo = false;

renderer.domElement.addEventListener("mousemove", (ev) => {
  mousePantalla.x = ev.clientX;
  mousePantalla.y = ev.clientY;
  mouseNDC.x = (ev.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(ev.clientY / window.innerHeight) * 2 + 1;
  hoverActivo = true;
});
renderer.domElement.addEventListener("mouseleave", () => {
  hoverActivo = false;
  tooltip.style.display = "none";
});

function actualizarTooltip() {
  if (!hoverActivo) return;
  raycaster.setFromCamera(mouseNDC, camara);
  const objetosHover = domInstanced ? [...grupoFilas.children, domInstanced] : grupoFilas.children;
  const intersecciones = raycaster.intersectObjects(objetosHover, false);
  if (intersecciones.length > 0) {
    const hit = intersecciones[0];
    const niveles = hit.object.userData.niveles;
    const nivel = niveles?.[hit.instanceId];
    if (nivel) {
      tooltip.style.display = "block";
      tooltip.style.left = mousePantalla.x + 14 + "px";
      tooltip.style.top = mousePantalla.y + 14 + "px";
      tooltipPrecio.textContent = "$" + nivel.precio.toLocaleString("en-US");
      tooltipQty.textContent = `bid: ${nivel.bid.toFixed(3)} | ask: ${nivel.ask.toFixed(3)} BTC`;
      return;
    }
  }
  tooltip.style.display = "none";
}

// -----------------------------------------------------
// Loop de render
// -----------------------------------------------------
let ultimoTiempo = performance.now();
function animar() {
  requestAnimationFrame(animar);
  const ahora = performance.now();
  const dt = (ahora - ultimoTiempo) / 1000;
  ultimoTiempo = ahora;

  actualizarBurbujas(dt);
  actualizarTooltip();
  controles.update();
  renderer.render(escena, camara);
  labelRenderer.render(escena, camara);
}
animar();

window.addEventListener("resize", () => {
  camara.aspect = window.innerWidth / window.innerHeight;
  camara.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
